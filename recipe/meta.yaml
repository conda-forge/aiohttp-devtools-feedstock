{% set name = "aiohttp-devtools" %}
{% set version = "1.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 918b9a4d5ee26f345ae46584c3977d9a4e363e160ec4b26b18e30b799cb82518

build:
  entry_points:
    - adev = aiohttp_devtools.cli:cli
    - aiohttp-devtools = aiohttp_devtools.cli:cli
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}
    - aiohttp >=3.8.0
    - click >=6.6
    - python-devtools >=0.6
    - pygments >=2.2.0
    - watchfiles >=0.10

test:
  imports:
    - aiohttp_devtools
  commands:
    - pip check
    - adev --help
    - aiohttp-devtools --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/aio-libs/aiohttp-devtools
  summary: Dev tools for aiohttp
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - apmorton
